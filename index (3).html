const AOP = [['How much carpet covers a floor?', 'Area'], ['How much fence goes around a yard?', 'Perimeter'], ['How much paper covers a table top?', 'Area'], ['How much ribbon goes around the edge of a card?', 'Perimeter'], ['How many tiles cover a bathroom floor?', 'Area'], ['How long is the border around a bulletin board?', 'Perimeter']];
mod({ id: 'g3-perim', g: 3, title: 'Perimeter', can: 'I can find the perimeter by adding all the sides.',
  lesson: { steps: ['Perimeter is the distance all the way around a shape.', 'Add up every side.', 'A rectangle has 2 long sides and 2 short sides: 6 + 4 + 6 + 4 = 20.', 'Area covers the inside. Perimeter goes around the edge.'], visual: () => rectLab(6, 4, 'cm', true) },
  gen() {
    const t = rnd(1, 5), [u, ul] = pick(UNITS);
    if (t === 1) { const w = rnd(3, 12), h = rnd(2, 9), P = 2 * (w + h);
      return numQ({ ask: 'What is the perimeter?', visual: rectLab(w, h, u, true), say: `This rectangle is ${w} ${ul} by ${h} ${ul}. What is the perimeter?`, answer: P, unit: u, hint: 'Add all four sides.', explain: `${w} + ${h} + ${w} + ${h} = ${P} ${ul}.` }); }
    if (t === 2) { let a, b, c; do { a = rnd(4, 12); b = rnd(3, 10); c = rnd(3, 10); } while (b + c <= a || a + b <= c || a + c <= b);
      return numQ({ ask: 'What is the perimeter?', visual: triLab(a, b, c, u), say: `A triangle has sides of ${a}, ${b}, and ${c} ${ul}. What is the perimeter?`, answer: a + b + c, unit: u, hint: 'Add all three sides.', explain: `${a} + ${b} + ${c} = ${a + b + c} ${ul}.` }); }
    if (t === 3) { const s = rnd(2, 10);
      return numQ({ ask: `A square has sides of ${s} ${ul}. What is the perimeter?`, say: `A square has sides of ${s} ${ul}. What is the perimeter?`, answer: 4 * s, unit: u, hint: 'A square has 4 sides that are all the same length.', explain: `${s} + ${s} + ${s} + ${s} = ${4 * s} ${ul}.` }); }
    if (t === 4) { const [q, a] = pick(AOP);

    const L = rnd(4, 10), W = rnd(2, L - 1), P = 2 * (L + W); const s = `A rectangle has a perimeter of ${P} ${ul}. It is ${L} ${ul} long. How wide is it?`;

  } });

function mstate(id) { if (!S.mods[id]) S.mods[id] = MDEF(); const m = S.mods[id], d = MDEF(); for (const k in d) if (m[k] === undefined) m[k] = d[k]; return m; }

function buildCard() {
  const nm = S.name || 'my daughter', L = [], fmtD = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  L.push(`MATH PATH PROGRESS CARD for ${nm} (${new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })})`);
  L.push('Use this as her current level. Skip the placement check.');
  L.push('');
  const ans = S.assess.answers;
  if (S.phase === 'welcome') L.push('She has not taken the 1st grade check yet.');
  else {
    if (!S.assess.doneAt) L.push(`1st grade check in progress: ${ans.length} of ${ASSESS_N} answered.`);
    if (S.assess.doneAt) {
      const both = id => { const rs = ans.filter(a => a.s === id); return rs.length === 2 && rs.every(a => a.ok); };
      const knew = G1.filter(both).map(id => BYID[id].title), needed = G1.filter(id => !both(id)).map(id => BYID[id].title);
      L.push(`1st grade check: both questions right on ${knew.length} of ${G1.length} skills.`);
      L.push(`Knew on the check: ${knew.join(', ') || 'none'}.`); L.push(`Needed: ${needed.join(', ') || 'none'}.`);
    }
    const missedCheck = ans.filter(a => !a.ok);
    if (missedCheck.length) { L.push(''); L.push('Missed on the check:'); missedCheck.slice(0, 10).forEach(a => L.push(`- ${BYID[a.s].title}: "${a.q}" She answered ${a.given}. Correct: ${a.ans}.`)); }
  }
  if (S.assess.doneAt) {
    L.push(''); L.push(`Mastered (passed the ${CHECK_N}-question check): ${ORDER.filter(isDone).map(id => BYID[id].title).join(', ') || 'none yet'}.`);
    const c = currentId();
    if (c) { const m = mstate(c);
      const stage = m.stage === 'check' ? (m.placed ? `She knew it on the placement check but still needs to pass the ${CHECK_N}-question check.` : `She finished practice and is ready for the ${CHECK_N}-question check.`) : m.stage === 'practice' ? `Practicing: ${Math.min(m.streak, PRACTICE_TARGET)} of ${PRACTICE_TARGET} in a row with no hints.` : 'Not started yet.';
      L.push(`Current module: ${BYID[c].title} (${GNAME[BYID[c].g]}). ${BYID[c].can} ${stage}`);
      const rest = ORDER.slice(ORDER.indexOf(c) + 1).filter(id => !isDone(id)); if (rest.length) L.push(`Up next: ${rest.slice(0, 3).map(id => BYID[id].title).join(', ')}${rest.length > 3 ? `, then ${rest.length - 3} more` : ''}.`); }
    else L.push('She has mastered every module through 3rd grade.');
    const checks = []; ORDER.forEach(id => mstate(id).checks.forEach(x => checks.push(Object.assign({ id }, x)))); checks.sort((a, b) => a.d - b.d);
    if (checks.length) L.push(`Recent checks: ${checks.slice(-5).map(x => `${BYID[x.id].title} ${x.s}/${x.n} (${x.s >= CHECK_PASS ? 'passed' : 'not passed'}, ${fmtD(x.d)})`).join('; ')}.`);
    const due = ORDER.filter(id => { const m = mstate(id); return m.st === 'mastered' && m.due && m.due <= Date.now(); });
    if (due.length) L.push(`Due for review: ${due.map(id => BYID[id].title).join(', ')}.`);
    const forgot = ORDER.filter(id => { const r = (mstate(id).reviews || []).slice(-1)[0]; return r && r.s < REVIEW_PASS && !isDone(id); });
    if (forgot.length) L.push(`Forgot on a review, back in practice: ${forgot.map(id => BYID[id].title).join(', ')}.`);
    const weak = ORDER.filter(id => { const m = S.mods[id]; return m && m.asked >= 6 && m.right / m.asked < .75; }).map(id => `${BYID[id].title} (${Math.round(S.mods[id].right / S.mods[id].asked * 100)}% first try)`);
    if (weak.length) L.push(`Hardest so far: ${weak.join(', ')}.`);
    const w = weekStats(); L.push(`Practice time: ${w.today} min today (goal ${goalMin()}). Last 7 days: ${w.avg} min a day on average, goal met ${w.met} of 7 days.`);
    const recent = (S.miss || []).slice(-10);
    if (recent.length) { L.push(''); L.push('Recent mistakes in practice:'); recent.forEach(x => L.push(`- ${BYID[x.id] ? BYID[x.id].title : x.id}: "${x.q}" She answered ${x.given}. Correct: ${x.ans}.`)); }
  }
  L.push(''); L.push('Help her with her current module or whatever she is stuck on, using the rules in the Project instructions.');
  return L.join('\n');
}

const PROJECT_TEXT = `You are a math tutor for my daughter, who is in 1st grade. I sit with her and type her answers. Teach her from 1st grade math through 3rd grade mastery.

1) PLACEMENT (1st grade only, do this once)
Check 12 skills, 2 questions each, 4 questions at a time: counting to 120; tens and ones; comparing numbers (>, <, =); coins and their values; adding to 20; subtracting to 20; missing numbers and true/false number sentences; add and take-away story problems; time to the hour and half hour; 10 more and 10 less; adding two-digit numbers; adding with a new ten.
No hints and no right/wrong during the check. After, list each skill as "Knows it" (2 of 2 right) or "Teach it."
If I paste a Math Path Progress Card, skip placement. Use the card as her current level: start from her current module and focus on the mistakes it lists.

2) PLAN
For 1st grade skills she missed, teach the full module. For skills she knew, skip the lesson but give the 8-question check before counting them as mastered. Go in the order above. Then teach every 2nd grade module, then every 3rd grade module, in order. Finish at 3rd grade mastery.
2nd grade: skip counting; place value to 1,000; comparing to 1,000; counting coins; adding with regrouping; subtracting with regrouping; time to 5 minutes and AM/PM; two-step story problems; dollars and cents; even and odd; equal groups and arrays; bar graphs; halves, thirds, fourths.
3rd grade: rounding; adding and subtracting to 1,000; what multiplying means; times facts 0-5 and 10; time to the minute; times facts 6-9; division; fractions; multiply and divide story problems; elapsed time; comparing fractions; area; perimeter.

3) EACH MODULE
- Teach: a short lesson (3-4 short sentences), then show one worked example step by step ("watch me do one"). Use the hands-on materials below when they fit.
- Practice: ask 4 questions at a time, and sometimes mix in a review of an earlier skill. She can ask for a hint. Wrong the first time: give a hint and let her try again. Wrong again: show the answer and why.
- Keep practicing until she gets 6 in a row right on the first try with no hint. Only then is she ready for the check.
- Check: 8 questions, no hints, one try each. 7 of 8 means mastered. Fewer than 7: teach it a different way, practice more, then give the check again.
- Review: bring each mastered skill back about 1, 3, 7, 14, 30 and 60 days later with 4 quick questions and no hints. 3 of 4 keeps it mastered. Fewer: back to practice and the check for that skill.

4) STYLE
Short sentences and simple words a 1st grader can follow. Lots of encouragement. Never give the answer before she tries.

5) PROGRESS
At the end of each session, give me a Progress Card: placement results, modules mastered, current module, and what she's stuck on. When I paste a Progress Card, pick up from there.

6) HANDS-ON MATERIALS WE HAVE AT HOME
- Foam base ten blocks: yellow cubes = ones (100), green rods = tens (20), blue flats = hundreds (10), red cube = one thousand (1).
- Play money: paper bills ($1, $5, $10, $20, $50, $100) and plastic pennies, nickels, dimes, and quarters, plus 30 money word-problem flashcards (3 levels).
- Dry-erase hundreds charts: one side numbered 1-100, the other side a blank 10 x 10 grid.
Whenever a lesson fits, have her use them so she can see and touch the math. Tell her exactly what to grab and what to do before asking questions (example: "Get 4 green rods and 7 yellow cubes. Count the rods by tens, then count on the cubes. What number did you make?"). Use them most for place value, regrouping (trade 10 yellow cubes for 1 green rod), counting coins, making change, dollars and cents, 10 more and 10 less, skip counting, equal groups, multiplication arrays, sharing for division, and area. Have her build or point, then tell me what she sees and I'll type it for her.`;

function labelFor(q, v) { if (q.type === 'num') return `${v}${q.unit ? (q.unit === '¢' ? '¢' : ' ' + q.unit) : ''}`; const c = q.choices.find(c => c.v === v); return (c && c.label) || v; }
function qText(q) { return strip(`${q.story ? q.story + ' ' : ''}${q.ask} ${q.big || ''}`).slice(0, 170) + (q.desc ? ` [${q.desc}]` : ''); }
function genUnique(id, avoid) { let q; for (let i = 0; i < 12; i++) { q = BYID[id].gen(); const key = strip((q.story || '') + q.ask + (q.big || '')); if (!avoid.includes(key)) { avoid.push(key); return q; } } return q; }
function newRun(kind, id, qs) { RUN = { kind, id, qs, i: 0, tries: 0, first: [], input: '', fb: null, wrong: [], shake: false, hinted: false }; }
function isFinal() { return !!(RUN && RUN.fb && RUN.fb.kind !== 'hint' && RUN.fb.kind !== 'hint0'); }
const hintsOK = () => !!(RUN && (RUN.kind === 'practice' || RUN.kind === 'free'));
function startAssessRound() {
  const n = S.assess.answers.length, r = Math.floor(n / 4), qs = [], avoid = [];
  for (let slot = r * 4; slot < r * 4 + 4; slot++) { const id = G1[Math.floor(slot / 2)]; const q = genUnique(id, avoid); q.skill = id; qs.push(q); }
  newRun('assess', null, qs); RUN.i = n - r * 4; RUN.first = Array(RUN.i).fill(true);
  go('q'); speak(RUN.qs[RUN.i].say);
}
function startRound(id, kind) {
  const avoid = [], qs = [];
  if (kind === 'check' || kind === 'review') { const n = kind === 'check' ? CHECK_N : REVIEW_N; for (let i = 0; i < n; i++) qs.push(genUnique(id, avoid)); }
  else {
    const pool = kind === 'practice' ? ORDER.slice(0, ORDER.indexOf(id)).filter(isDone) : [];
    const mix = pool.length && Math.random() < .75;
    for (let i = 0; i < (mix ? 3 : 4); i++) qs.push(genUnique(id, avoid));
    if (mix) { const rid = pick(pool), rq = genUnique(rid, avoid); rq.review = BYID[rid].title; rq.reviewId = rid; qs.splice(rnd(1, qs.length), 0, rq); }
    if (kind === 'practice') { const m = mstate(id); if (m.stage === 'learn') m.stage = 'practice'; }
  }
  newRun(kind, id, qs);
  go('q'); speak(RUN.qs[0].say);
}
const PRAISE = ['Yes! That is right.', 'Great job!', 'You got it!', 'Nice work!', 'Correct!'];
function logMiss(q, given) { if (!S.miss) S.miss = []; S.miss.push({ id: q.reviewId || RUN.id, q: qText(q), given: String(labelFor(q, given)), ans: String(labelFor(q, q.answer)), k: RUN.kind, d: Date.now() }); if (S.miss.length > 40) S.miss = S.miss.slice(-40); }
function submit(given) {
  const q = RUN.qs[RUN.i]; if (isFinal()) return;
  const ok = q.type === 'num' ? Number(given) === q.answer : given === q.answer;
  if (RUN.kind === 'assess') {
    S.assess.answers.push({ s: q.skill, ok, q: qText(q), given: String(labelFor(q, given)), ans: String(labelFor(q, q.answer)) });
    const n = S.assess.answers.length;
    if (n % 4 === 0) { if (n >= ASSESS_N) finishAssess(); else { save(); go('assessBreak'); speak(`Round ${n / 4} done! Stand up and stretch.`); } return; }
    saveLocal(); RUN.i++; RUN.input = ''; toast('Got it!'); go('q'); speak(RUN.qs[RUN.i].say); return;
  }
  const cur = !q.reviewId;
  if (ok) {
    const clean = RUN.tries === 0 && !RUN.hinted;
    RUN.first.push(clean);
    if (RUN.kind === 'practice' && cur) { const m = mstate(RUN.id); m.streak = clean ? m.streak + 1 : 0; }
    RUN.fb = { kind: RUN.tries ? 'fixed' : 'right', msg: RUN.hinted && !RUN.tries ? 'Yes! Next time, try it without the hint.' : pick(PRAISE) };
    render(); speak(RUN.fb.kind === 'right' ? RUN.fb.msg : 'You fixed it!');
    return;
  }
  if (RUN.tries === 0) logMiss(q, given);
  if (RUN.kind === 'practice') { if (cur) mstate(RUN.id).streak = 0; else { const rm = mstate(q.reviewId); if (rm.st === 'mastered') rm.due = Math.min(rm.due || Infinity, Date.now()); } }
  if (hintsOK() && RUN.tries === 0) {
    RUN.tries = 1; RUN.fb = { kind: 'hint' }; if (q.type === 'choice') RUN.wrong.push(given); RUN.input = ''; RUN.shake = true;
    render(); RUN.shake = false; speak('Not quite. ' + q.hint); return;
  }
  RUN.first.push(false); RUN.fb = { kind: 'show' }; if (q.type === 'choice') RUN.wrong.push(given);
  render(); speak('The answer is ' + answerSay(q) + '. ' + q.explain);
}
function nextQ() {
  hush(); RUN.i++; RUN.tries = 0; RUN.fb = null; RUN.input = ''; RUN.wrong = []; RUN.hinted = false;
  if (RUN.i < RUN.qs.length) { go('q'); speak(RUN.qs[RUN.i].say); return; }
  endRound();
}
function endRound() {
  const id = RUN.id, k = RUN.kind, n = RUN.qs.length, score = RUN.first.filter(Boolean).length, m = mstate(id);
  S.hist.push({ id, d: Date.now(), s: score, n, k }); if (S.hist.length > 150) S.hist = S.hist.slice(-150);
  if (k === 'free') { save(); go('roundEnd', { id, k, score, n }); speak(`${score} of ${n} on the first try.`); return; }
  if (k === 'practice') {
    m.rounds++; RUN.qs.forEach((q, i) => { if (!q.reviewId) { m.asked++; if (RUN.first[i]) m.right++; } });
    const ready = m.streak >= PRACTICE_TARGET; if (ready) m.stage = 'check';
    save(); go('roundEnd', { id, k, score, n, ready }); speak(ready ? "You're ready for the check!" : `${Math.min(m.streak, PRACTICE_TARGET)} in a row. Keep practicing!`); return;
  }
  if (k === 'check') {
    m.checks.push({ d: Date.now(), s: score, n }); m.asked += n; m.right += score;
    if (score >= CHECK_PASS) { m.st = 'mastered'; m.at = Date.now(); m.box = 1; schedule(m); m.placed = false; S.stars++; if (!currentId()) S.phase = 'done'; save(); go('mastered', { id, score, n }); speak(`You mastered ${BYID[id].title}!`); return; }
    m.stage = 'practice'; m.streak = 0; save(); go('roundEnd', { id, k, score, n }); speak(`${score} of ${n}. Let's practice a little more.`); return;
  }
  revToday().n++; m.reviews.push({ d: Date.now(), s: score, n });
  if (score >= REVIEW_PASS) { m.box = Math.min(m.box + 1, INTERVALS.length + 1); schedule(m); S.stars++; save(); go('roundEnd', { id, k, score, n, pass: true }); speak('You still remember it!'); return; }
  m.st = 'todo'; m.stage = 'practice'; m.streak = 0; m.box = 0; m.due = null; if (S.phase === 'done') S.phase = 'path';
  save(); go('roundEnd', { id, k, score, n, pass: false }); speak("Let's practice this one again.");
}
function finishAssess() {
  for (const id of G1) { const rs = S.assess.answers.filter(a => a.s === id), m = mstate(id); m.st = 'todo'; if (rs.length === 2 && rs.every(a => a.ok)) { m.stage = 'check'; m.placed = true; } else { m.stage = 'learn'; m.placed = false; } }
  for (const id of ORDER) mstate(id);
  S.assess.doneAt = Date.now(); S.phase = 'path';
  save(); go('assessDone'); speak(`All done! Great work, ${S.name || 'friend'}.`);
}

/* ================= events ================= */
function copyText(txt, elId) { const sel = () => { const el = document.getElementById(elId); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Tap Copy.'); }; try { navigator.clipboard.writeText(txt).then(() => toast('Copied'), sel); } catch (e) { sel(); } }
const ACT = {
  toggleSpeak() { S.settings.speak = !S.settings.speak; if (!S.settings.speak) hush(); save(); render(); },
  parent() { if (SCREEN === 'parent') return; hush(); PREV = { screen: SCREEN, data: DATA }; go('parent', {}); },
  closeParent() { const p = PREV || { screen: homeScreen(), data: {} }; PREV = null; if (p.screen === 'q' && !RUN) return go(homeScreen()); go(p.screen, p.data); },
  resetAsk() { DATA.confirmReset = true; render(); },
  resetNo() { DATA.confirmReset = false; render(); },
  resetYes() { const keep = { name: S.name, speak: S.settings.speak }; S = fresh(); S.name = keep.name; S.settings.speak = keep.speak; RUN = null; PREV = null; save(); go('welcome'); },
  copyCard() { copyText(buildCard(), 'cardText'); },
  syncConnect() { const el = document.getElementById('syncUrl'); const v = ((el && el.value) || '').trim().replace(/\/+$/, ''); if (!SYNC_URL_RE.test(v)) { DATA.syncErr = "That doesn't look like a Realtime Database URL. It starts with https:// and ends in firebaseio.com or firebasedatabase.app."; return render(); } const code = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join(''); S.sync = { url: v, code, last: 0, err: '' }; DATA.syncErr = ''; lastPush = 0; save(); render(); },
  copyLink() { copyText(parentLink(), 'plink'); },
  syncNow() { syncPush(); },
  syncOff() { S.sync = null; save(); render(); },
  vRefresh() { viewerFetch(); },
  setGoal(d) { S.settings.goal = Number(d.v); save(); render(); },
  copyProj() { copyText(PROJECT_TEXT, 'projText'); },
  say() { if (RUN) speak(RUN.qs[RUN.i].say, true); },
  sayLesson(d) { const m = BYID[d.id], ex = DATA.ex; speak(`${m.title}. ${m.lesson.steps.join(' ')}${ex ? ` Watch me do one. ${strip(ex.say)} The answer is ${answerSay(ex)}. ${strip(ex.explain)}` : ''}${HANDS[d.id] ? ' Try it with your things at home. ' + HANDS[d.id] : ''}`, true); },
  anotherEx() { if (SCREEN !== 'lesson') return; DATA.ex = genUnique(DATA.id, []); render(); },
  hint() { if (!hintsOK() || RUN.fb) return; RUN.hinted = true; RUN.fb = { kind: 'hint0' }; render(); speak(RUN.qs[RUN.i].hint); },
  back() { const f = backAction(); if (f) f(); },
  assessGo() { startAssessRound(); },
  toMap() { hush(); RUN = null; go(S.phase === 'done' ? 'final' : 'map'); },
  toMapAll() { hush(); RUN = null; go('map'); },
  openMod(d) { hush(); RUN = null; go('lesson', { id: d.id, ex: genUnique(d.id, []) }); },
  startRound(d) { hush(); startRound(d.id, d.kind || 'practice'); },
  key(d) { if (!RUN || isFinal()) return; if (d.k === 'del') RUN.input = RUN.input.slice(0, -1); else if (RUN.input.length < 4) RUN.input = (RUN.input === '0' ? '' : RUN.input) + d.k; render(); },
  check() { if (RUN && RUN.input !== '') submit(RUN.input); },
  choose(d) { if (RUN) submit(d.v); },
  next() { nextQ(); },
  gradeDone(d) { const nx = currentId(); if (!nx) return go('final'); go('gradeDone', { g: Number(d.g) }); speak(`You finished ${GNAME[d.g]} math!`); }
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t || t.disabled) return; const f = ACT[t.dataset.act]; if (f) { e.preventDefault(); f(t.dataset); } });
document.addEventListener('submit', e => { if (e.target.id === 'nameForm') { e.preventDefault(); const v = (document.getElementById('nameInput').value || '').trim().slice(0, 20); S.name = v; S.phase = 'assess'; S.assess.startedAt = Date.now(); save(); go('assessIntro'); speak(`Hi ${v || 'friend'}! This check has ${ASSESS_N} questions. Just try your best.`); } });
document.addEventListener('keydown', e => {
  if (SCREEN !== 'q' || !RUN || e.target.tagName === 'INPUT') return;
  const q = RUN.qs[RUN.i], final = isFinal();
  if (final && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return nextQ(); }
  if (final || q.type !== 'num') return;
  if (/^[0-9]$/.test(e.key)) { ACT.key({ k: e.key }); e.preventDefault(); }
  else if (e.key === 'Backspace') { ACT.key({ k: 'del' }); e.preventDefault(); }
  else if (e.key === 'Enter') { ACT.check(); e.preventDefault(); }
});

/* ================= sync to parent phone ================= */
const VIEW = (() => { const m = location.hash.match(/^#view=([A-Za-z0-9]{24,64})@([A-Za-z0-9.-]+\.(?:firebaseio\.com|firebasedatabase\.app))$/i); return m ? { code: m[1], url: 'https://' + m[2] } : null; })();
let syncTimer = null, lastPush = 0, VSTATE = { status: 'loading', err: '', updatedAt: 0 };
const SYNC_URL_RE = /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/i;
const syncEndpoint = sy => `${sy.url}/families/${sy.code}.json`;
function parentLink() { return `${location.origin}${location.pathname}#view=${S.sync.code}@${S.sync.url.replace(/^https:\/\//i, '')}`; }
function syncErrText(e, status) { if (status === 401 || status === 403) return 'Permission denied. Check the database rules (Part 1, step 6).'; if (status === 404) return 'Database not found. Check the URL.'; if (status) return `The database answered with error ${status}.`; return 'Could not reach the database. Check the URL and the internet connection.'; }
async function syncPush(keep) {
  if (VIEW || !S || !S.sync || !S.sync.url) return;
  clearTimeout(syncTimer); syncTimer = null; lastPush = Date.now();
  const body = JSON.stringify({ data: JSON.stringify(S), updatedAt: S.updatedAt || Date.now(), v: 2 });
  let status = 0;
  try { const r = await fetch(syncEndpoint(S.sync), { method: 'PUT', body, keepalive: !!keep && body.length < 60000 }); status = r.status; if (!r.ok) throw new Error('http'); S.sync.last = Date.now(); S.sync.err = ''; }
  catch (e) { S.sync.err = syncErrText(e, status); }
  saveLocal(); if (SCREEN === 'parent') render();
}
function syncSoon() { if (VIEW || !S || !S.sync || !S.sync.url) return; const wait = Math.max(0, 20000 - (Date.now() - lastPush)); if (wait === 0) syncPush(); else if (!syncTimer) syncTimer = setTimeout(() => syncPush(), wait); }
async function viewerFetch() {
  let status = 0;
  try {
    const r = await fetch(syncEndpoint(VIEW), { cache: 'no-store' }); status = r.status; if (!r.ok) throw new Error('http');
    const j = await r.json();
    if (!j || !j.data) { VSTATE = { status: 'empty', err: '', updatedAt: 0 }; if (SCREEN !== 'parent') go('viewer'); return; }
    S = migrate(JSON.parse(j.data)); VSTATE = { status: 'ok', err: '', updatedAt: j.updatedAt || S.updatedAt };
    if (SCREEN === 'parent') render(); else go('parent');
  } catch (e) {
    VSTATE.err = syncErrText(e, status);
    if (SCREEN === 'parent') render(); else { VSTATE.status = 'error'; go('viewer'); }
  }
}

/* ================= practice time ================= */
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const goalMin = () => (S && S.settings && S.settings.goal) || 20;
const usedSec = (k = dayKey()) => (S && S.usage && S.usage[k]) || 0;
const IDLE_MS = 150000, TICK = 5;
const TRACK = ['q', 'lesson', 'roundEnd', 'assessBreak', 'assessIntro', 'assessDone', 'mastered', 'gradeDone', 'map', 'final'];
let lastAct = Date.now(), unsaved = 0;
['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
function updateGoalUI() {
  const el = document.getElementById('goal'); if (!el) return;
  const show = S && S.phase !== 'welcome' && SCREEN !== 'loading' && SCREEN !== 'welcome';
  el.hidden = !show; if (!show) return;
  const m = Math.floor(usedSec() / 60), g = goalMin(), hit = m >= g;
  el.classList.toggle('hit', hit);
  el.innerHTML = `${hit ? IC.star : ''}<span>Today <b>${Math.min(m, 999)}</b> of ${g} min</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${g}" aria-valuenow="${Math.min(m, g)}" aria-label="Minutes practiced today"><i style="width:${Math.min(100, m / g * 100)}%"></i></div>`;
}
function weekStats() {
  const days = []; for (let i = 0; i < 7; i++) { const d = new Date(); d.setDate(d.getDate() - i); days.push(dayKey(d)); }
  const mins = days.map(k => Math.floor(usedSec(k) / 60)), g = goalMin();
  let streak = 0; for (let i = 0; i < 400; i++) { const d = new Date(); d.setDate(d.getDate() - i); const mm = Math.floor(usedSec(dayKey(d)) / 60); if (mm >= g) streak++; else if (i === 0) continue; else break; }
  return { avg: Math.round(mins.reduce((a, b) => a + b, 0) / 7), met: mins.filter(m => m >= g).length, streak, today: mins[0] };
}
setInterval(() => {
  if (VIEW || !S || document.visibilityState !== 'visible' || !TRACK.includes(SCREEN) || Date.now() - lastAct > IDLE_MS) return;
  if (!S.usage) S.usage = {};
  const k = dayKey(), before = usedSec(k);
  S.usage[k] = before + TICK; unsaved += TICK;
  const keys = Object.keys(S.usage).sort(); while (keys.length > 120) delete S.usage[keys.shift()];
  const g = goalMin() * 60;
  if (before < g && S.usage[k] >= g) { if (!S.goalHit) S.goalHit = {}; S.goalHit[k] = 1; save(); unsaved = 0; const t = document.createElement('div'); t.className = 'toast'; t.textContent = `${goalMin()} minutes! Today's goal is done.`; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }
  else if (unsaved >= 60) { save(); unsaved = 0; }
  if (Math.floor(before / 60) !== Math.floor(S.usage[k] / 60)) updateGoalUI();
}, TICK * 1000);
document.addEventListener('visibilitychange', () => {
  if (VIEW) { if (document.visibilityState === 'visible') viewerFetch(); return; }
  if (document.visibilityState === 'hidden' && S) { if (unsaved) { S.updatedAt = Date.now(); saveLocal(); unsaved = 0; } if (S.sync && S.sync.url) syncPush(true); }
});

/* ================= boot ================= */
async function boot() {
  if (VIEW) { go('viewer'); viewerFetch(); setInterval(() => { if (document.visibilityState === 'visible') viewerFetch(); }, 60000); return; }
  let local = null; try { local = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { }
  if (local && (local.v === 1 || local.v === 2)) { S = migrate(local); saveLocal(); go(homeScreen()); } else go('loading');
  const p = Promise.resolve(null);
  let db = null;
  if (!S) { const r = await Promise.race([p, sleep(3000).then(() => 'timeout')]); if (r === 'timeout') { S = fresh(); go('welcome'); db = await p; } else db = r; }
  else db = await p;
  if (!db) { if (!S) { S = fresh(); go('welcome'); } if (S.sync && S.sync.url) syncPush(); return; }
  DB = db;
  let remote = null;
  try { const snap = await db.doc('progress/main').get(); if (snap.exists) remote = JSON.parse(JSON.stringify(snap.data())); saveWhere = 'account'; } catch (e) { }
  if (!S) S = fresh();
  if (remote && remote.v === 1 && (remote.updatedAt || 0) > (S.updatedAt || 0)) { S = remote; saveLocal(); RUN = null; PREV = null; go(homeScreen()); }
  else if (S.updatedAt > 0 && (!remote || S.updatedAt > (remote.updatedAt || 0))) dbSave();
  if (SCREEN === 'loading') go(homeScreen());
  if (SCREEN === 'parent') render();
}
boot();
